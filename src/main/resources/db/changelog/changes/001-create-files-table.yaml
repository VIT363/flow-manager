databaseChangeLog:
  - changeSet:
      id: 001-create-files-table
      author: vit-zemtsov

      changes:
        - createTable:
            tableName: files
            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: original_file_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: source_bucket
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: source_object_name
                  type: VARCHAR(1024)
                  constraints:
                    nullable: false

              - column:
                  name: converted_bucket
                  type: VARCHAR(255)

              - column:
                  name: converted_object_name
                  type: VARCHAR(1024)

              - column:
                  name: status
                  type: VARCHAR(32)
                  constraints:
                    nullable: false

              - column:
                  name: error_message
                  type: TEXT

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false